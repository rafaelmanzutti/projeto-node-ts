
---

## Documento 3 — `docs/swagger.yaml`

```yaml
openapi: 3.0.3
info:
  title: Cadastro de Clientes API
  description: |
    API REST para cadastro e gerenciamento de usuários e clientes.
    Rotas protegidas exigem o header `Authorization: Bearer <accessToken>`.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Servidor local de desenvolvimento

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        name:
          type: string
          nullable: true
          example: "Rafael Manzutti"
        email:
          type: string
          format: email
          example: "rafael@email.com"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
          example: "João Silva"
        email:
          type: string
          format: email
          nullable: true
          example: "joao@email.com"
        phone:
          type: string
          nullable: true
          example: "11999999999"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClientsPage:
      type: object
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 11
        totalCount:
          type: integer
          example: 45
        totalPages:
          type: integer
          example: 5
        clients:
          type: array
          items:
            $ref: '#/components/schemas/Client'

    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "Dados Inválidos."
        error:
          type: array
          items:
            type: object

    MessageResponse:
      type: object
      properties:
        message:
          type: string

paths:

  # ─── AUTH ──────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      tags: [Auth]
      summary: Login de usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "rafael@email.com"
                password:
                  type: string
                  minLength: 8
                  example: "minhasenha123"
      responses:
        200:
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TokenPair'
        400:
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        404:
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/token:
    post:
      tags: [Auth]
      summary: Renovar access token via refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        200:
          description: Novo par de tokens gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TokenPair'
        400:
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  # ─── USER ──────────────────────────────────────────────────────────────────

  /user:
    post:
      tags: [User]
      summary: Cadastrar novo usuário
      description: Rota pública. Cria o usuário e sua pasta de arquivos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                name:
                  type: string
                  example: "Rafael Manzutti"
                email:
                  type: string
                  format: email
                  example: "rafael@email.com"
                password:
                  type: string
                  minLength: 8
                  example: "minhasenha123"
      responses:
        200:
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Criado com Sucesso."
                  data:
                    $ref: '#/components/schemas/User'
        400:
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        409:
          description: E-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /user/{id}:
    get:
      tags: [User]
      summary: Buscar dados do usuário
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Usuário encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Usuário encontrado."
                  data:
                    $ref: '#/components/schemas/User'
        401:
          description: Token ausente ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        403:
          description: Acesso negado (id do token diferente do parâmetro)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        404:
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

    patch:
      tags: [User]
      summary: Atualizar nome do usuário
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "Rafael M."
      responses:
        200:
          description: Usuário atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
        400:
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [User]
      summary: Deletar usuário e todos os seus dados
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Usuário deletado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'

  # ─── USER CLIENT ───────────────────────────────────────────────────────────

  /user-client:
    post:
      tags: [UserClient]
      summary: Cadastrar cliente
      description: Cria um cliente vinculado ao usuário autenticado e sua pasta de arquivos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "João Silva"
                email:
                  type: string
                  format: email
                  example: "joao@email.com"
                phone:
                  type: string
                  example: "11999999999"
      responses:
        200:
          description: Cliente criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Criado com Sucesso."
                  data:
                    $ref: '#/components/schemas/Client'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'

    get:
      tags: [UserClient]
      summary: Listar clientes (paginado)
      description: |
        Retorna clientes do usuário autenticado com paginação.
        O parâmetro `search` filtra por substring no nome (case-insensitive).
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Número da página (padrão 1)
        - name: search
          in: query
          schema:
            type: string
          description: Filtro por nome do cliente (busca por substring)
          example: "joão"
      responses:
        200:
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ClientsPage'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          description: Página não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /user-client/{id}:
    get:
      tags: [UserClient]
      summary: Buscar cliente por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Cliente encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Cliente encontrado."
                  data:
                    $ref: '#/components/schemas/Client'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [UserClient]
      summary: Atualizar dados do cliente
      description: Pelo menos um campo deve ser enviado.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "João da Silva"
                email:
                  type: string
                  format: email
                  example: "joao@novoemail.com"
                phone:
                  type: string
                  example: "11988887777"
      responses:
        200:
          description: Cliente atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Client'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [UserClient]
      summary: Deletar cliente e seus arquivos
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Cliente deletado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      email:
                        type: string
                        nullable: true
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'

  # ─── RESET PASSWORD ────────────────────────────────────────────────────────

  /reset-password:
    post:
      tags: [ResetPassword]
      summary: "Passo 1 — Solicitar código de recuperação"
      description: |
        Valida se o email existe e gera um código secreto de 6 dígitos.
        Em produção o código é enviado por email. Em desenvolvimento é retornado na resposta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: "rafael@email.com"
      responses:
        200:
          description: Código gerado (retornado na resposta em modo dev)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Código enviado por email."
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                      secret:
                        type: integer
                        example: 482931
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [ResetPassword]
      summary: "Passo 3 — Redefinir senha"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, secret, newPassword]
              properties:
                email:
                  type: string
                  format: email
                  example: "rafael@email.com"
                secret:
                  type: string
                  minLength: 6
                  example: "482931"
                newPassword:
                  type: string
                  minLength: 8
                  example: "novasenha123"
      responses:
        200:
          description: Senha redefinida com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'

  /reset-password/validate:
    post:
      tags: [ResetPassword]
      summary: "Passo 2 — Validar código secreto"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, secret]
              properties:
                email:
                  type: string
                  format: email
                  example: "rafael@email.com"
                secret:
                  type: string
                  minLength: 6
                  example: "482931"
      responses:
        200:
          description: Código validado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Código de segurança validado com sucesso."
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                      secret:
                        type: integer
        400:
          description: Código inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        404:
          $ref: '#/components/responses/NotFound'

  responses:
    BadRequest:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token ausente ou inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Forbidden:
      description: Acesso negado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
